name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25.0.4.1+1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+1.1'
      - name: Assert JDK version
        shell: bash
        run: |
          set -euo pipefail
          version="$(java -version 2>&1)"
          printf '%s\n' "$version"
          grep -F '25.0.4.1+1' <<<"$version"
      - name: Compile and run ProtocolTest
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/prototest"
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror -d "$out" \
            ime/src/org/modavd/ime/HostProtocol.java ime/test/ProtocolTest.java
          java -cp "$out" org.modavd.ime.ProtocolTest

  apk-build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25.0.4.1+1
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4+1.1'
      - name: Assert JDK version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& java -version 2>&1 | Out-String)
          $version
          if ($version -notmatch '25\.0\.4\.1\+1') { throw "需要 Temurin 25.0.4.1+1，实际是：$version" }
      - name: Test SDK fallback and failure handling
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\test_android_sdk_fallback.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SDK fallback tests failed' }
      - name: Hide preinstalled platform for issue 83 validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'
          if (Test-Path -LiteralPath $jar) { Rename-Item -LiteralPath $jar -NewName 'android.jar.issue83-backup' }
          if (Test-Path -LiteralPath $jar) { throw 'Expected missing preinstalled android.jar' }
          Write-Host 'Verified missing preinstalled android.jar; next step must download Android 36 r2.'
      - name: Check android.jar and build APKs
        shell: pwsh
        env:
          TZ: CET-1
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedJarHash = 'd9eb9da824d9e247a352f570f01e1169e725b2954bca9e283a71786c59b59f9a'
          # repository2-3.xml: platforms;android-36 r2, SHA-1 2c1a80dd4d9f7d0e6dd336ec603d9b5c55a6f576.
          # Google publishes SHA-1 only; this SHA-256 was computed after checking it.
          $archiveName = 'platform-36_r02.zip'
          $expectedArchiveHash = '37607369a28c5b640b3a7998868d45898ebcb777565a0e85f9acf36f29631d2e'
          $jar = Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'
          $sdkTemp = $null
          try {
            if (-not (Test-Path -LiteralPath $jar -PathType Leaf) -or
                (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedJarHash) {
              Write-Host '预装 android.jar 缺失或 SHA-256 不符，下载 Android 36 r2。'
              $sdkTemp = Join-Path $env:RUNNER_TEMP ("android-36-r2-" + [guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $sdkTemp | Out-Null
              $archive = Join-Path $sdkTemp $archiveName
              Invoke-WebRequest -Uri "https://dl.google.com/android/repository/$archiveName" -OutFile $archive
              $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expectedArchiveHash) { throw "SDK 压缩包 SHA-256 不符：$hash" }
              $sdk = Join-Path $sdkTemp 'sdk'
              Expand-Archive -LiteralPath $archive -DestinationPath $sdk
              $jar = Join-Path $sdk 'android-36\android.jar'
              if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) { throw "找不到 $jar" }
              $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $expectedJarHash) { throw "android.jar SHA-256 不符：$hash" }
            }
            pwsh -NoProfile -File .\build.ps1 -BuildTools (Join-Path $env:ANDROID_HOME 'build-tools\36.1.0') -AndroidJar $jar
            if ($LASTEXITCODE -ne 0) { throw "APK 构建失败（退出码 $LASTEXITCODE）" }
          } finally {
            if ($sdkTemp -and (Test-Path -LiteralPath $sdkTemp)) {
              Remove-Item -LiteralPath $sdkTemp -Recurse -Force
            }
          }

      - name: Verify issue 83 fallback against v1.0.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'issue83-release'
          New-Item -ItemType Directory -Path $dir | Out-Null
          $release = Join-Path $dir 'release.apk'
          Invoke-WebRequest 'https://github.com/ModAVD/ModAVDHostIME/releases/download/v1.0.0/modavd-ime.apk' -OutFile $release
          $expected = ((Get-Content -LiteralPath 'release/1.0.0.SHA256SUMS.txt' -Raw) -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $release -Algorithm SHA256).Hash -ne $expected) { throw 'Released APK checksum mismatch' }
          $pass = Join-Path $dir 'temporary.pass'
          $ks = Join-Path $dir 'temporary.p12'
          Set-Content -LiteralPath $pass -Value 'temporary-ci-password' -NoNewline -Encoding ascii
          & (Join-Path $env:JAVA_HOME 'bin/keytool.exe') -genkeypair -noprompt -keystore $ks -storetype PKCS12 -alias ci -keyalg RSA -keysize 4096 -validity 1 -dname 'CN=Temporary CI' -storepass:file $pass -keypass:file $pass
          if ($LASTEXITCODE -ne 0) { throw 'keytool failed' }
          $signer = Join-Path $env:ANDROID_HOME 'build-tools/36.1.0/apksigner.bat'
          $built = Join-Path $dir 'temporary-signed.apk'
          & $signer sign --ks $ks --ks-type PKCS12 --ks-key-alias ci --ks-pass "file:$pass" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out $built 'out/obj/ime/aligned.apk'
          if ($LASTEXITCODE -ne 0) { throw 'apksigner sign failed' }
          python -B -I -X utf8 scripts/verify_release_apk.py --built-apk $built --release-apk $release --apksigner $signer --certificate-sha256 d18cca3c1982149349f164d28e02490b2eb694e44d56834fa02a1062eb42e823
          if ($LASTEXITCODE -ne 0) { throw 'Release provenance mismatch' }
          @'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import verify_release_apk as verify
          root = Path(os.environ['RUNNER_TEMP']) / 'issue83-release'
          built = (root / 'temporary-signed.apk').read_bytes()
          release = (root / 'release.apk').read_bytes()
          expected = Path('release/1.0.0.SHA256SUMS.txt').read_text().split()[0]
          verify.compare_apks(built, release)
          lb, lr = verify.parse_layout(built), verify.parse_layout(release)
          assert lb == lr
          assert built[:lb.block_start] == release[:lr.block_start]
          assert built[lb.block_end:] == release[lr.block_end:]
          restored = built[:lb.block_start] + release[lr.block_start:lr.block_end] + built[lb.block_end:]
          assert restored == release
          assert hashlib.sha256(restored).hexdigest() == expected
          print(json.dumps({'missing_preinstalled_sdk': True, 'all_bytes_outside_signature_equal': True, 'signature_offset': lb.block_start, 'signature_length': lb.block_end - lb.block_start, 'original_signature_restored_equals_release': True, 'sha256': expected, 'note': 'Reused published signature block; not independently signed with the formal key.'}))
          '@ | python -B -I -X utf8 -
          if ($LASTEXITCODE -ne 0) { throw 'Full byte/checksum reproduction failed' }


  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan tracked files for private data
        shell: bash
        run: python3 -B -I -X utf8 scripts/privacy.py . --allowlist scripts/privacy-allowlist.json

  authors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHECK_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
      CHECK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CHECK_MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - name: Checkout full history without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run repo checks unit tests
        shell: bash
        run: python3 -B -I -X utf8 scripts/test_repo_checks.py -v
      - name: Check commit authors and trailers
        shell: bash
        run: python3 -B -I -X utf8 scripts/repo_checks.py
